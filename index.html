<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FACEBOOK STORY CLONE</title>
    <!-- LINK CSS -->
    <link rel="stylesheet" href="style.css" />
    <!-- FOR ICONS -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <!-- NAVBAR -->

    <div class="navbar">
      <div class="nav-left">
        <img
          src="https://img.icons8.com/?size=100&id=118497&format=png&color=000000"
          alt="Facebook"
          class="logo"
        />
        <input type="text" placeholder="Search Facebook" class="search-bar" />
      </div>

      <div class="nav-center">
        <span
          ><div class="material-symbols-outlined nav-center-icons">
            HOME
          </div></span
        >
        <span
          ><div class="material-symbols-outlined nav-center-icons">
            live_tv
          </div></span
        >
        <span
          ><div class="material-symbols-outlined nav-center-icons">
            storefront
          </div></span
        >
        <span
          ><div class="material-symbols-outlined nav-center-icons">
            groups
          </div></span
        >
        <span
          ><div class="material-symbols-outlined nav-center-icons">
            explore
          </div></span
        >
      </div>

      <div class="nav-right">
        <span
          ><div class="material-symbols-outlined nav-right-icons">
            add
          </div></span
        >
        <span
          ><div class="material-symbols-outlined nav-right-icons">
            chat
          </div></span
        >
        <span
          ><div class="material-symbols-outlined nav-right-icons">
            notifications
          </div></span
        >
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgidau2QPZciAPCgVK2_LDHddvhBB0R2bdALxe35bOew&s=10"
          alt="Profile"
          class="profile-pic"
        />
      </div>
    </div>

    <!-- STORY SECTION  -->

    <div class="story-section">
      <div class="story-container">
        <div class="story">
          <img
            src="https://images.pexels.com/photos/36980067/pexels-photo-36980067.jpeg"
            alt=""
            class="story-main-img"
          />
          <img
            src="https://images.pexels.com/photos/5234265/pexels-photo-5234265.jpeg"
            alt=""
            class="profile-pic-story"
          />
          <p class="story-username">BAZIL UBAB</p>
        </div>

        <div class="story">
          <img
            src="https://images.pexels.com/photos/29934597/pexels-photo-29934597.jpeg"
            alt=""
            class="story-main-img"
          />
          <img
            src="https://images.pexels.com/photos/3761521/pexels-photo-3761521.jpeg"
            alt=""
            class="profile-pic-story"
          />
          <p class="story-username">AREEB SHEIKH</p>
        </div>

        <div class="story">
          <img
            src="https://images.pexels.com/photos/28943264/pexels-photo-28943264.jpeg"
            alt=""
            class="story-main-img"
          />
          <img
            src="https://media.istockphoto.com/id/2172317014/photo/happy-hispanic-man-working-on-laptop-at-home.jpg?b=1&s=612x612&w=0&k=20&c=ukqKyfuXrrr3JQ9JQ_XFPVldwCAyNOAqgthkRiRcbzs="
            alt=""
            class="profile-pic-story"
          />
          <p class="story-username">MOARIJ</p>
        </div>

        <div class="story">
          <img
            src="https://images.pexels.com/photos/11485207/pexels-photo-11485207.jpeg"
            alt=""
            class="story-main-img"
          />
          <img
            src="https://images.pexels.com/photos/30109427/pexels-photo-30109427.jpeg"
            alt=""
            class="profile-pic-story"
          />
          <p class="story-username">KHUBAB</p>
        </div>

        <div class="story">
          <img
            src="https://images.pexels.com/photos/29935507/pexels-photo-29935507.jpeg"
            alt=""
            class="story-main-img"
          />
          <img
            src="https://images.pexels.com/photos/7562185/pexels-photo-7562185.jpeg"
            alt=""
            class="profile-pic-story"
          />
          <p class="story-username">NOORSHAH</p>
        </div>
      </div>
    </div>
  </body>
</html>
